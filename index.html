<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="https://google.com">
    <title>Google</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; }
        .logo { font-size: 90px; font-weight: bold; margin-bottom: 30px; letter-spacing: -3px; }
        .g { color: #4285F4; } .r { color: #EA4335; } .o1 { color: #FBBC05; } .o2 { color: #4285F4; } .g2 { color: #34A853; } .e { color: #EA4335; }
        .search-box { width: 90%; max-width: 580px; position: relative; }
        .search-input { width: 100%; padding: 14px 20px; font-size: 16px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; box-shadow: none; transition: box-shadow 0.2s; }
        .search-input:hover, .search-input:focus { box-shadow: 0 1px 6px rgba(32,33,36,0.28); border-color: rgba(223,225,229,0); }
        .btn-container { margin-top: 25px; display: flex; gap: 12px; }
        .btn { background-color: #f8f9fa; border: 1px solid #f8f9fa; border-radius: 4px; color: #3c4043; font-size: 14px; padding: 10px 16px; cursor: pointer; user-select: none; }
        .btn:hover { border: 1px solid #c6c6c6; color: #222; background-image: linear-gradient(top,#f8f9fa,#f1f3f4); }
    </style>
</head>
<body>

    <div class="logo">
        <span class="g">G</span><span class="r">o</span><span class="o1">o</span><span class="o2">g</span><span class="g2">l</span><span class="e">e</span>
    </div>

    <div class="search-box">
        <input type="text" id="target-url" class="search-input" placeholder="Search Google or type a URL to bypass..." autocomplete="off">
    </div>

    <div class="btn-container">
        <div class="btn" onclick="launchSandbox()">Google Search</div>
        <div class="btn" onclick="launchSandbox()">I'm Feeling Lucky</div>
    </div>

    <script>
        document.getElementById('target-url').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                launchSandbox();
            }
        });

        function launchSandbox() {
            const inputField = document.getElementById('target-url');
            const urlInput = inputField.value.trim();
            if (!urlInput) return;

            let targetUrl = urlInput;
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
            }

            // 【2026年海外最新公开的、完全不包含 workers.dev 的独立匿名高速 Bare 节点】
            // 节点1（主线可用）：
            const publicBareServer = "https://tunnels-hub.xyz";
            
            // 如果节点1由于被学校集中流量盯上卡顿，你可以随时把上面一行换成下面这个节点2（学术类伪装独立域名）：
            // const publicBareServer = "https://science-helper.net";

            const finalProxyPath = publicBareServer + btoa(targetUrl);

            const blankWindow = window.open();
            if (!blankWindow) {
                alert("Chromebook popups blocked! Please allow popups for this site.");
                return;
            }

            blankWindow.document.title = "Google Docs - Language Arts Essay";
            const link = blankWindow.document.createElement('link');
            link.rel = 'icon';
            link.href = 'https://gstatic.com';
            blankWindow.document.head.appendChild(link);

            blankWindow.document.body.style.margin = '0';
            blankWindow.document.body.style.height = '100vh';
            blankWindow.document.body.style.overflow = 'hidden';

            const iframe = blankWindow.document.createElement('iframe');
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            iframe.src = finalProxyPath;

            blankWindow.document.body.appendChild(iframe);
            inputField.value = '';
        }
    </script>
</body>
</html>
